name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.1"
            rails: "7.2"
          - ruby: "3.2"
            rails: "8.0"
          - ruby: "3.2"
            rails: "8.1"
          - ruby: "3.3"
            rails: "8.1"
          - ruby: "3.4"
            rails: "8.1"
          - ruby: "4.0"
            rails: "8.1"

    env:
      RAILS_VERSION: ${{ matrix.rails }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Build gem
        if: matrix.ruby == '3.4' && matrix.rails == '8.1'
        run: bundle exec rake build
